# Tools in de IJK Toolbox en de behoeften waarvoor de coach ze adviseert.
# Bron: presentatie "Verantwoord innoveren en ontwikkelen met de IJK Toolbox coach" (nov. 2026).
# Beheer: Team Digitale Ontwikkeling. Verhoog bij wijziging de versie.
# TODO: valideren door toetsers

versie: "0.5"

tools:
  - id: m365_copilot
    naam: Microsoft 365 Copilot
    spelregels: spelregels/m365_copilot.yaml
    icoon: iconen/m365_copilot.png
  - id: copilot_workflows
    naam: Copilot workflows
    omschrijving: >-
      Automatiseert terugkerende taken binnen Microsoft 365 (Outlook, Teams, SharePoint, Planner).
      Kan niet koppelen met systemen buiten Microsoft 365. De workflow draait op het account van de medewerker.
      Functie in vroege toegang (Microsoft Frontier-programma) die nog kan veranderen.
    spelregels: spelregels/copilot_workflows.yaml
    icoon: iconen/copilot_workflows.png
  - id: hubbi
    naam: HubBI
    omschrijving: >-
      IJK's eigen automatiserings- en integratieplatform voor AFAS: voor handmatige, repeterende taken in en om AFAS.
    spelregels: spelregels/hubbi.yaml
    icoon: iconen/hubbi.png
  - id: ai_flows
    naam: AI Flows
    spelregels: spelregels/ai_flows.yaml
    icoon: iconen/ai_flows.png
  - id: claude_code
    naam: Claude Code
    spelregels: spelregels/claude_code.yaml
    icoon: iconen/claude_code.png
  - id: azure_openai
    naam: Azure OpenAI
    spelregels: spelregels/azure_openai.yaml
    icoon: iconen/azure_openai.png

behoeften:
  - id: sneller_afhandelen
    omschrijving: Mails, vergaderingen en documenten sneller afhandelen
    tools: [m365_copilot]
  - id: m365_automatiseren
    omschrijving: Een taak in Microsoft 365 automatiseren
    tools: [copilot_workflows]
  - id: verbinden
    omschrijving: Systemen of gegevens met elkaar verbinden
    tools: [hubbi]
  - id: ai_in_werkproces
    omschrijving: AI toevoegen aan een werkproces
    tools: [ai_flows]
  - id: bouwen
    omschrijving: Een tool, app of dashboard bouwen
    tools: [claude_code]
  - id: ai_model_eigen_oplossing
    omschrijving: Een AI-model gebruiken in een eigen oplossing
    tools: [azure_openai]

# Toelichting bij het kiezen van een tool. Wordt in de wizard getoond én aan de coach meegegeven.
keuzehints:
  - HubBI is voor handmatige, repeterende taken in en om AFAS. Gebruik HubBI bij voorkeur ook voor data van klantmedewerkers waarvoor IJK verwerker is.
  - Copilot workflows automatiseert terugkerende taken binnen Microsoft 365 en kan niet koppelen met systemen buiten Microsoft 365.
  - AI Flows en Copilot workflows zijn beide geschikt om AI-stappen in werkprocessen in te bouwen. Kies AI Flows bij data van klantmedewerkers waarvoor IJK verwerker is.

# Alleen voor de coach (niet zichtbaar in de wizard).
coach_instructies:
  - IJK gebruikt geen n8n. Stel het nooit voor.
