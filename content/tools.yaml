# Tools in de IJK Toolbox en de behoeften waarvoor de coach ze adviseert.
# Bron: presentatie "Verantwoord innoveren en ontwikkelen met de IJK Toolbox coach" (nov. 2026) en
# "IJK Digitale Toolbox" (positionering, nov. 2026).
# Beheer: Team Digitale Ontwikkeling. Verhoog bij wijziging de versie.
# Wat een tool doet, waarvoor hij geschikt is en wanneer de coach hem adviseert (de adviesregels) staat in
# adviesregels.yaml en is te beheren in het beheerscherm. Hier staan de vaste gegevens per tool.
# TODO: valideren door toetsers

versie: "0.9"

# categorie: werken | automatiseren | bouwen | ai_modellen. rol: de rol van de tool in een oplossing (vast label).
# ai: true = de tool gebruikt zelf AI. Dan staat de vraag "Gebruikt je oplossing AI?" vooraf op "Ja"
# (een sterk signaal, de medewerker bevestigt). Bij andere tools hangt het af van wat je bouwt. AI Flows kan ook
# zonder AI (flow editor binnen HubBI), dus daar niet.
# beheer: wie de tool beheert en waar je een licentie of account aanvraagt. Bij "Account aanvragen" gaat de
# aanvraag per e-mail naar dit adres. licentienaam: hoe de licentie heet in de aanvraagmail ({licentie}).
tools:
  - id: m365_copilot
    naam: Microsoft 365 Copilot
    categorie: werken
    rol: Assistent voor de medewerker
    spelregels: spelregels/m365_copilot.yaml
    ai: true
    icoon: iconen/m365_copilot.png
    beheer:
      naam: ICT Driessen Groep
      email: ict@driessengroep.nl
      licentienaam: Copilot for MS365 licentie
      licentie: De uitgebreide licentie Copilot for Microsoft 365. Daarmee heb je ook Copilot workflows.
  - id: copilot_workflows
    naam: Copilot workflows
    categorie: automatiseren
    rol: Automatiseringsplatform binnen Microsoft 365
    spelregels: spelregels/copilot_workflows.yaml
    icoon: iconen/copilot_workflows.png
    beheer:
      naam: ICT Driessen Groep
      email: ict@driessengroep.nl
      licentienaam: Copilot for MS365 licentie
      licentie: Onderdeel van de uitgebreide licentie Copilot for Microsoft 365.
  - id: hubbi
    naam: HubBI
    categorie: automatiseren
    rol: Automatiseringsplatform voor bedrijfsprocessen
    spelregels: spelregels/hubbi.yaml
    icoon: iconen/hubbi.png
    beheer:
      naam: HR tech (IJK)
      email: info@hubbi.nl # TODO: definitief adres voor licentieaanvragen bevestigen
      licentienaam: HubBI-licentie
  - id: ai_flows
    naam: AI Flows
    categorie: automatiseren
    rol: Flow editor binnen HubBI
    spelregels: spelregels/ai_flows.yaml
    icoon: iconen/ai_flows.png
    beheer:
      naam: HR tech (IJK)
      email: info@hubbi.nl # TODO: definitief adres voor licentieaanvragen bevestigen
      licentienaam: AI Flows-add-on voor HubBI
      licentie: Add-on binnen HubBI.
  - id: claude_code
    naam: Claude Code
    categorie: bouwen
    rol: Ontwikkeltool
    spelregels: spelregels/claude_code.yaml
    icoon: iconen/claude_code.png
    beheer:
      naam: Team Digitale Ontwikkeling
      email: digitaleontwikkeling@ijk.nl
      licentienaam: Claude Code-licentie
  - id: azure_openai
    naam: Azure OpenAI
    categorie: ai_modellen
    rol: AI-model en capability
    # TODO: beheer en aanvraagadres voor Azure OpenAI nog bepalen.
    spelregels: spelregels/azure_openai.yaml
    ai: true
    icoon: iconen/azure_openai.png

behoeften:
  - id: sneller_afhandelen
    omschrijving: Het eigen kenniswerk ondersteunen met AI, zoals mails, vergaderingen, teksten en documenten
    tools: [m365_copilot]
  - id: m365_automatiseren
    omschrijving: Een terugkerende taak binnen Microsoft 365 automatiseren
    tools: [copilot_workflows]
  - id: verbinden
    omschrijving: Een bedrijfsproces automatiseren, in en rond AFAS of met meerdere systemen
    tools: [hubbi]
  - id: ai_in_werkproces
    omschrijving: AI als bouwsteen toevoegen aan een geautomatiseerd proces
    tools: [hubbi, copilot_workflows]
  - id: bouwen
    omschrijving: Een eigen applicatie, tool of dashboard bouwen (maatwerk)
    tools: [claude_code]
  - id: ai_model_eigen_oplossing
    omschrijving: Een AI-model gebruiken in een eigen oplossing of proces
    tools: [azure_openai]
