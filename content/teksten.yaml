# Teksten in de interface. Beheer: Team Digitale Ontwikkeling.
# Helder, laagdrempelig, zonder jargon.

app:
  naam: IJK Toolbox Coach
  uitgangspunt: Niet de tool bepaalt wat mag, maar wat je ermee doet.
  testdata_melding: "Proof of concept: gebruik alleen testgegevens en fictieve voorbeelden."

fases:
  - naam: Welke tool past?
    stappen: [1, 2]
  - naam: Mag ik dit doen?
    stappen: [3, 4]

stappen:
  - nummer: 1
    titel: Wat wil je bereiken?
    instructie: Beschrijf in eigen woorden welk probleem je wilt oplossen of welk idee je hebt, zonder al aan een tool te denken.
  - nummer: 2
    titel: Welke tool past?
    instructie: Op basis van je beschrijving adviseert de coach een tool uit de IJK Toolbox.
  - nummer: 3
    titel: Zes checks
    instructie: De coach heeft de checks alvast ingevuld op basis van je beschrijving. Klopt het? Pas aan waar nodig.
  - nummer: 4
    titel: Advies
    instructie: Dit is je advies, berekend met de vaste spelregels van IJK.

spelregels_kopjes:
  zelf_doen: Wat mag je zelf doen?
  eerst_toetsen: Wanneer laat je eerst toetsen?
  altijd: Waar let je altijd op?

vervolgacties:
  accountaanvraag:
    knop: "Account aanvragen voor {tool}"
    uitleg: Je kunt direct aan de slag. Vraag een account aan voor de geadviseerde tool.
  accountaanvraag_met_voorwaarden:
    knop: "Account aanvragen voor {tool}"
    uitleg: Je kunt aan de slag als je je aan de voorwaarden houdt. De voorwaarden gaan mee met je aanvraag.
  toetsing:
    knop: Aanvraag indienen voor toetsing
    uitleg: Laat je idee eerst toetsen. Je aanvraag gaat naar de juiste toetser(s), die een melding in Teams krijgen.
  alleen_vastleggen:
    knop: ""
    uitleg: Op deze manier kan het niet. Je advies is vastgelegd. Bekijk hieronder hoe het wel kan, of stel je vraag aan de coach.

# "Wat nu?" nadat de vervolgactie is uitgevoerd of de toetsers hebben besloten.
# {tool} = gekozen tool, {toetsers} = namen van de toetsers.
na_actie:
  account_aangevraagd: Je accountaanvraag voor {tool} is verstuurd. De status van je aanvraag zie je bij Mijn aanvragen.
  in_toetsing: Je aanvraag is ingediend bij {toetsers}. Zij beoordelen je idee. Het besluit, met eventuele voorwaarden, zie je bij Mijn aanvragen.
  goedgekeurd: Je aanvraag is goedgekeurd. Je kunt aan de slag.
  goedgekeurd_met_voorwaarden: Je aanvraag is goedgekeurd met voorwaarden. Houd je aan de voorwaarden van de toetsers hierboven.
  afgewezen: Je aanvraag is afgewezen. Lees de motivatie van de toetsers hierboven. Heb je vragen, stel ze dan aan de coach of neem contact op met de toetser.
  contact_volgt: Op deze manier kan het niet, en er is geen kant-en-klaar alternatief. Team Digitale Ontwikkeling neemt contact met je op om samen te kijken wat wel kan. Ga in de tussentijd niet zelf een andere weg zoeken.

# De rode vlaggen uit het kader, zoals de medewerker ze ziet. Neutraal geformuleerd:
# een "ja" is geen fout, de coach helpt dan verder.
aanvullende_vragen:
  titel: Aanvullende vragen
  intro: Nog een paar vragen over hoe je de oplossing maakt en gebruikt.
  vraag_label: "Vraag {nummer}"
  geen: Nee op alle vragen

# Uitleg vóór fase 2 (na het tooladvies, vóór de checks). TODO: valideren (concepttekst)
fase2_uitleg:
  titel: "Fase 2 · Mag ik dit doen?"
  intro: >-
    Je weet nu welke tool past. In deze fase kijken we of en hoe je ermee aan de slag kunt.
    Niet de tool bepaalt wat mag, maar wat je ermee doet.
  hoe_titel: Hoe werkt het?
  hoe:
    - De coach (een AI agent) vult de checks alvast in op basis van je beschrijving.
    - Jij controleert de antwoorden en past ze aan waar nodig. Twijfelt de coach, dan stelt hij een vraag in de chat.
    - Daarna berekent de tool je advies met de vaste spelregels van IJK. De AI agent bepaalt de uitkomst niet.
  vragen_titel: Welke vragen krijg je, en waarom?
  vragen_intro: "Zes checks, elk over een ander soort risico:"
  # Per check-id: waarom we dit vragen.
  waarom_per_check:
    data: Hoe gevoeliger de gegevens, hoe groter de gevolgen als ze bij de verkeerde terechtkomen.
    systemen: Hoe meer de oplossing in IJK-systemen leest of wijzigt, hoe belangrijker veilige koppelingen en de juiste rechten zijn.
    gebruikers: Hoe breder een oplossing wordt gebruikt, hoe meer eisen we stellen aan beheer, beveiliging en continuïteit.
    autonomie: Hoe zelfstandiger de oplossing werkt, hoe belangrijker menselijke controle is.
    impact: Wat er gebeurt als het misgaat, als het niet werkt, als de uitkomst fout is of als informatie bij de verkeerde komt.
    afhankelijkheid: Of de oplossing een experiment is of een vast onderdeel van het werk. Dat bepaalt wat je extra moet regelen.
  aanvullend: >-
    Daarna volgen een paar aanvullende vragen over hoe je de oplossing maakt en gebruikt. Daarmee vangen we situaties af
    die altijd een risico geven, zoals inloggen met een persoonlijk account.
  daarna_titel: Wat gebeurt er daarna?
  daarna_intro: "Je krijgt een advies in één van vier kleuren:"
  # Per vervolgactie: wat er na de wizard gebeurt.
  per_vervolgactie:
    accountaanvraag: Je vraagt direct een account aan voor de tool.
    accountaanvraag_met_voorwaarden: Je vraagt een account aan. De voorwaarden gaan mee met je aanvraag.
    toetsing: Je aanvraag gaat naar de juiste toetser(s). Zij beoordelen je idee en leggen een besluit vast.
    alleen_vastleggen: Op deze manier kan het niet. Je krijgt een alternatief, of Team Digitale Ontwikkeling neemt contact met je op.
  register: >-
    Je advies krijgt een referentienummer en komt in het adviesregister, met je naam en e-mailadres, zodat de toetsers
    weten wie ze kunnen benaderen. Bij Mijn aanvragen volg je de status en zie je het besluit van de toetsers. Verandert er later iets aan je idee? Dan doorloop je de wizard opnieuw.
  knop: Begin met de checks
  opnieuw_lezen: Lees de uitleg over deze fase opnieuw

# Melding bij een nieuw idee als er nog een onafgemaakt idee is. {beschrijving} = begin van dat idee.
onafgemaakt:
  melding: "Je hebt nog een onafgemaakt idee: \"{beschrijving}\""
  knop: Verder met dat idee

# Knop en bevestiging om de wizard af te ronden als er niets meer te doen is.
afronden:
  knop: Afronden
  bevestiging: "Klaar. Je advies {referentie} is afgerond en staat hieronder. Hier volg je ook de status."

statussen:
  advies_gegeven: Advies gegeven
  account_aangevraagd: Account aangevraagd
  in_toetsing: In toetsing
  goedgekeurd: Goedgekeurd
  goedgekeurd_met_voorwaarden: Goedgekeurd met voorwaarden
  afgewezen: Afgewezen
  contact_volgt: Contact volgt

besluiten:
  goedgekeurd: Goedgekeurd
  goedgekeurd_met_voorwaarden: Goedgekeurd met voorwaarden
  afgewezen: Afgewezen

toetsing:
  titel: Toetsing
  intro: Aanvragen die bij jouw rol als toetser horen. Bekijk de antwoorden en leg je besluit vast. Je inzage wordt vastgelegd in de audit-log.
  toelichting_voorwaarden: Welke voorwaarden gelden?
  toelichting_afwijzing: Waarom wijs je de aanvraag af?
  ter_informatie: Ter informatie (Niet op deze manier)
  ter_informatie_uitleg: Bij deze uitkomst is er geen aanvraag en hoef je geen besluit te nemen. Je ziet hem zodat je weet wat er speelt.

beheer:
  titel: Beheer
  intro: Alle adviezen en de inhoud van de coach. De inhoud (tools, spelregels, beslisregels) wijzig je via Git in de map content/; elke wijziging krijgt een nieuw versienummer. Je inzage wordt vastgelegd in de audit-log.

# Bij check 6: lijst met wat je extra moet regelen per antwoord.
extra_regelen_titel: Wat moet je extra regelen?

# Rode uitkomst zonder alternatief: Team DO kon (nog) niet worden ingelicht.
contact_opnieuw:
  melding: Team Digitale Ontwikkeling is nog niet op de hoogte gebracht. Probeer het opnieuw.
  knop: Team Digitale Ontwikkeling informeren

# Verdieping in stap 3 en de beoordelingen op de adviescard (regelset 0.8). TODO: valideren door toetsers
verdieping:
  privacy_intro: >-
    Je gaf aan dat je persoonsgegevens gebruikt. Daarom stel ik bij een paar checks nog een extra vraag over wat de
    oplossing met die gegevens doet.
  privacy_intro_onzeker: >-
    Je weet niet zeker of je persoonsgegevens gebruikt. Daarom gaan we voor de zekerheid uit van wel, en stel ik bij
    een paar checks nog een extra vraag.
  ai_titel: Over de AI in je oplossing
  ai_intro: Je gaf aan dat je oplossing AI gebruikt. Daarom wil ik nog iets beter begrijpen wat de AI doet.
  ai_intro_onzeker: >-
    Je weet niet zeker of je oplossing AI gebruikt. Daarom gaan we voor de zekerheid uit van wel en stel ik nog een paar
    vragen over wat de oplossing doet.
  tool_voorstel: Voorgesteld op basis van de gekozen tool
  voortgang: "Nog {aantal} van {totaal} vragen te beantwoorden."
  voortgang_een: "Nog 1 van {totaal} vragen te beantwoorden."
  voortgang_klaar: Alle {totaal} vragen zijn beantwoord.

# Stap 3 als gesprek: de coach stelt de vragen één voor één. De vragen zelf komen uit de regelset.
# TODO: valideren (concepttekst)
gesprek:
  instructie: De coach loopt de checks met je door, één vraag tegelijk.
  intro: >-
    Ik loop zes checks met je door, één vraag tegelijk. Bij de meeste vragen heb ik op basis van je beschrijving al
    een antwoord voorgesteld. Klopt het? Dan bevestig je het met één klik. Klopt het niet? Kies dan zelf.
  intro_zonder_coach: >-
    Ik loop zes checks met je door, één vraag tegelijk. Ik kon nu geen antwoorden voorstellen, dus je kiest zelf.
  kop_check: "Check {nummer} van {totaal} · {naam}"
  kop_aanvullend: "Aanvullende vraag {nummer}"
  voorstel: "Op basis van je beschrijving denk ik: {antwoord}. Klopt dat?"
  voorstel_onzeker: "Ik weet het niet zeker, maar ik denk: {antwoord}. Kijk je even mee?"
  voorstel_tool: "Omdat de gekozen tool AI gebruikt, heb ik alvast gekozen: {antwoord}. Klopt dat?"
  twijfel: "Ik twijfel nog: {vraag}"
  al_bekend: "Dit hoef ik niet meer te vragen, want het volgt uit je antwoorden:"
  wat_bedoel_je: Wat bedoel je hiermee?
  vraag_coach: Stel de coach een vraag
  chat_label: Iets niet duidelijk? Vraag het de coach
  chat_label_klaar: Nog een vraag voordat je het advies bekijkt?
  chat_plaatshouder: "Bijvoorbeeld: wat bedoel je met lezen?"
  chat_stuur: Stuur
  denkt: Even denken…
  eerdere_berichten: "Eerdere berichten met de coach ({aantal})"
  bevestig: Ja, klopt
  volgende: Volgende
  wijzig: Wijzig
  jouw_antwoord: "Jouw antwoord:"
  klaar: >-
    Dat waren alle vragen. Kijk je antwoorden hierboven nog even na; met Wijzig pas je er een aan. Klopt alles? Dan
    bereken ik het advies met de vaste spelregels van IJK.
  naar_lijst: Toon alle vragen op één pagina
  naar_gesprek: Terug naar het gesprek
  naar_formulier: Toon als formulier
  # Fase 1 als gesprek (wat wil je bereiken, vragen van de coach, tooladvies).
  fase1_intro: >-
    Hoi! Ik ben de coach. Ik help je eerst een passende tool uit de IJK Toolbox te kiezen. Daarna kijken we samen of
    en hoe je ermee aan de slag kunt. Beschrijf in eigen woorden welk probleem je wilt oplossen of welk idee je hebt,
    zonder al aan een tool te denken.
  fase1_vraag: Welk probleem wil je oplossen, of welk idee heb je?
  # Koppen van de vraag van de coach (anders dan de kop van de stap erboven).
  kop_beschrijving: Waar kan ik je mee helpen?
  kop_tool: Mijn advies
  kop_fase2: Hoe gaat fase 2 in zijn werk?
  beschrijving_hulp: >-
    Bijvoorbeeld: "Ik wil elke week een overzicht van openstaande facturen, zodat mijn team weet wat er openstaat."
    Gebruik geen echte namen of gegevens van personen.
  leest: De coach leest je beschrijving…
  verduidelijking_intro: Beantwoorden is niet verplicht, maar helpt me om je beter te adviseren.
  niet_beantwoord: (niet beantwoord)
  tooladvies_intro: "Op basis van wat je vertelt, past deze tool het best:"
  tool_vraag: Welke tool wil je gebruiken?

privacy:
  titel: Privacy
  niet_nodig: Je gebruikt geen persoonsgegevens. Een privacybeoordeling (DPIA) is daarom niet nodig.
  per_klasse:
    geen: Er is geen of één privacy-indicator. Een volledige DPIA is waarschijnlijk niet nodig.
    waarschijnlijk: >-
      Er zijn twee privacy-indicatoren. Waarschijnlijk is een volledige DPIA (gegevensbeschermingseffectbeoordeling)
      nodig. De AI governance & compliance officer kijkt met je mee.
    verplicht: >-
      Er zijn drie of meer privacy-indicatoren. Een volledige DPIA (gegevensbeschermingseffectbeoordeling) is verplicht.
      De AI governance & compliance officer kijkt met je mee.
  indicatoren_titel: "Wat telde mee:"
  geen_indicatoren: Geen van de privacy-indicatoren is van toepassing.

ai:
  titel: AI
  niet_nodig: Je oplossing gebruikt geen AI. Een AI-risicobeoordeling is daarom niet nodig.
  per_klasse:
    laag: Bij je antwoorden is het risico van de AI laag.
    beperkt: Bij je antwoorden is het risico van de AI beperkt. Regel wat hieronder staat.
    hoog: >-
      Bij je antwoorden is het risico van de AI hoog. De AI governance & compliance officer bepaalt in welke klasse van de
      AI Act (de Europese wet voor AI) je toepassing valt.
  redenen_titel: "Dit gaf de doorslag:"
  feiten_titel: "Wat we weten over de AI:"

techniek:
  titel: Techniek en beheer
  intro: "Regel en laat beoordelen:"
  # Per check.antwoord. Getoond als dat antwoord is gekozen.
  punten:
    systemen.lezen: Een goedgekeurde koppeling met IJK-credentials en alleen leesrechten.
    systemen.koppelen: De rechten en credentials van de koppeling, en logging.
    systemen.schrijven: Wat de oplossing mag wijzigen in het bedrijfssysteem, met logging en herstel bij fouten.
    gebruikers.afdeling: Beheer en ondersteuning voor alle gebruikers in de afdeling.
    gebruikers.organisatie: Beheer, ondersteuning en continuïteit voor gebruikers in heel IJK.
    gebruikers.extern: Beveiligde toegang voor mensen buiten IJK.
    afhankelijkheid.persoonlijk: Documentatie en beveiliging.
    afhankelijkheid.team: Eigenaarschap, beheer en logging.
    afhankelijkheid.bedrijf: Monitoring, architectuur, continuïteit en lifecycle management.

disclaimer: >-
  Deze uitkomst is een eerste risico-indicatie en geen definitief juridisch of compliance-oordeel. Laat de beoordeling
  waar nodig controleren door de relevante specialist vanuit Privacy, Security of AI.

# Stap 2: een tool die (nog) niet in de IJK Toolbox zit. TODO: valideren door toetsers
andere_tool:
  optie: Een andere tool (nog niet in de IJK Toolbox)
  naam_label: Naam van de tool
  link_label: Link naar de tool (optioneel)
  link_hulp: Bijvoorbeeld de website van de leverancier. De link begint met https://.
  link_fout: Een link begint met https:// (of http://).
  uitleg: >-
    Deze tool zit nog niet in de IJK Toolbox, dus er zijn nog geen spelregels voor. Je doorloopt gewoon de checks.
    Je idee gaat daarna altijd ter toetsing naar de AI governance & compliance officer en de architect Digitale
    Ontwikkeling. Zij kijken of de tool veilig is, of hij past bij IJK en of er een tool in de toolbox is die
    hetzelfde kan.
  kenmerk: nog niet in de IJK Toolbox

coach_niet_beschikbaar: De coach is nu niet beschikbaar. Je kunt gewoon verder door zelf te kiezen.

# Uitlegpagina "Hoe werkt de coach?" (/hoe-werkt-het) en korte verwijzingen ernaar.
hoe_werkt_het:
  titel: Hoe werkt de coach?
  link: Hoe werkt de coach?
  intro: >-
    De IJK Toolbox Coach gebruikt een AI agent om met je mee te denken. Maar de AI agent beslist niet
    of je idee goedgekeurd wordt. Dat bepalen de vaste spelregels van IJK en, als dat nodig is, de toetsers.
    Zo is elk advies uitlegbaar en krijgt iedereen met dezelfde antwoorden hetzelfde advies.
  wie_titel: Wie doet wat?
  rijen:
    - onderdeel: Je idee begrijpen
      wie: AI-coach
      hoe: De coach leest je beschrijving en stelt hooguit twee vragen als iets nog niet duidelijk is.
    - onderdeel: Welke tool past?
      wie: AI-coach
      hoe: De coach kiest een tool uit de IJK Toolbox en legt uit waarom. Je kunt het advies accepteren, om een andere tool vragen of zelf kiezen.
    - onderdeel: De zes checks
      wie: AI-coach stelt voor, jij bevestigt
      hoe: De coach vult de checks alvast in. Twijfelt hij, dan vraagt hij door in de chat. Jij ziet de voorstellen en past ze aan waar nodig.
    - onderdeel: Aanvullende vragen
      wie: Jij
      hoe: Deze vragen beantwoord je altijd zelf.
    - onderdeel: Het advies (de kleur)
      wie: Vaste spelregels
      hoe: De tool berekent de kleur, de toetsers en of een DPIA mogelijk nodig is. Dat gebeurt met de spelregels van IJK, niet door de AI agent.
    - onderdeel: Uitleg bij het advies
      wie: AI-coach
      hoe: De coach legt het berekende advies uit in gewone taal. Hij kan het advies niet veranderen.
    - onderdeel: Vragen tussendoor
      wie: AI-coach
      hoe: In de chat kun je op elk moment een vraag stellen over de tools en de spelregels.
    - onderdeel: Vervolgactie
      wie: Jij en de tool
      hoe: Pas als jij op de knop klikt, vraagt de tool een account aan of stuurt je aanvraag naar de toetsers. De AI agent kan dat niet zelf.
  waarom_titel: Waarom bepaalt de AI agent niet de kleur?
  waarom:
    - "Uitlegbaar: bij elk advies staat welke antwoorden de doorslag gaven en met welke versie van de spelregels het is berekend."
    - "Eerlijk: dezelfde antwoorden geven altijd hetzelfde advies. Een taalmodel kan op dezelfde vraag verschillende antwoorden geven."
    - "Controleerbaar: de spelregels worden beheerd door Team Digitale Ontwikkeling en de AI governance & compliance officer."
  privacy_titel: Wat gaat er naar de AI agent?
  privacy:
    - Alleen wat nodig is voor de vraag, zoals je beschrijving en je antwoorden.
    - Niet je naam of e-mailadres. De coach kent je alleen als een willekeurige code.
    - E-mailadressen, telefoonnummers en rekeningnummers in je tekst worden er eerst uitgehaald. Gebruik toch liever geen namen of andere persoonsgegevens.
    - Het gesprek wordt niet bewaard in het adviesregister. Na het afronden wordt het verwijderd.
  zonder_ai_titel: En als de AI agent niet werkt?
  zonder_ai: Dan vul je alles zelf in. Je krijgt hetzelfde advies, want dat wordt altijd met de vaste spelregels berekend.
  demo_melding: In deze demo is de coach een oefencoach zonder AI. Die geeft eenvoudige voorbeeldantwoorden.
  kleur_hint: Deze kleur is berekend met de vaste spelregels van IJK, niet door de AI agent.
