# Teksten in de interface. Beheer: Team Digitale Ontwikkeling.
# Helder, laagdrempelig, zonder jargon.

app:
  naam: IJK Toolbox Coach
  uitgangspunt: Niet de tool bepaalt wat mag, maar wat je ermee doet.
  testdata_melding: "Proof of concept: gebruik alleen testgegevens en fictieve voorbeelden."

fases:
  - naam: Welke tool past?
    stappen: [1, 2]
  - naam: Mag ik dit doen?
    stappen: [3, 4]

stappen:
  - nummer: 1
    titel: Wat wil je bereiken?
    instructie: Beschrijf in eigen woorden welk probleem je wilt oplossen of welk idee je hebt, zonder al aan een tool te denken.
  - nummer: 2
    titel: Welke tool past?
    instructie: Op basis van je beschrijving adviseert de coach een tool uit de IJK Toolbox.
  - nummer: 3
    titel: Zes checks
    instructie: De coach heeft de checks alvast ingevuld op basis van je beschrijving. Klopt het? Pas aan waar nodig.
  - nummer: 4
    titel: Advies
    instructie: Dit is je advies, berekend met de vaste spelregels van IJK.

spelregels_kopjes:
  zelf_doen: Wat mag je zelf doen?
  eerst_toetsen: Wanneer laat je eerst toetsen?
  altijd: Waar let je altijd op?

vervolgacties:
  accountaanvraag:
    knop: "Account aanvragen voor {tool}"
    uitleg: Je kunt direct aan de slag. Vraag een account aan voor de geadviseerde tool.
  accountaanvraag_met_voorwaarden:
    knop: "Account aanvragen voor {tool}"
    uitleg: Je kunt aan de slag als je je aan de voorwaarden houdt. De voorwaarden gaan mee met je aanvraag.
  toetsing:
    knop: Aanvraag indienen voor toetsing
    uitleg: Laat je idee eerst toetsen. Je aanvraag gaat naar de juiste toetser(s), die een melding in Teams krijgen.
  alleen_vastleggen:
    knop: ""
    uitleg: Op deze manier kan het niet. Je advies is vastgelegd. Bekijk hieronder hoe het wel kan, of stel je vraag aan de coach.

# "Wat nu?" nadat de vervolgactie is uitgevoerd of de toetsers hebben besloten.
# {tool} = gekozen tool, {toetsers} = namen van de toetsers.
na_actie:
  account_aangevraagd: Je accountaanvraag voor {tool} is verstuurd. De status van je aanvraag zie je bij Mijn aanvragen.
  in_toetsing: Je aanvraag is ingediend bij {toetsers}. Zij beoordelen je idee. Het besluit, met eventuele voorwaarden, zie je bij Mijn aanvragen.
  goedgekeurd: Je aanvraag is goedgekeurd. Je kunt aan de slag.
  goedgekeurd_met_voorwaarden: Je aanvraag is goedgekeurd met voorwaarden. Houd je aan de voorwaarden van de toetsers hierboven.
  afgewezen: Je aanvraag is afgewezen. Lees de motivatie van de toetsers hierboven. Heb je vragen, stel ze dan aan de coach of neem contact op met de toetser.
  contact_volgt: Op deze manier kan het niet, en er is geen kant-en-klaar alternatief. Team Digitale Ontwikkeling neemt contact met je op om samen te kijken wat wel kan. Ga in de tussentijd niet zelf een andere weg zoeken.

# De rode vlaggen uit het kader, zoals de medewerker ze ziet. Neutraal geformuleerd:
# een "ja" is geen fout, de coach helpt dan verder.
aanvullende_vragen:
  titel: Aanvullende vragen
  intro: Nog een paar vragen over hoe je de oplossing maakt en gebruikt. Is het antwoord "ja", dan laat de coach zien hoe het wel veilig kan.
  vraag_label: "Vraag {nummer}"
  geen: Nee op alle vragen

# Melding bij een nieuw idee als er nog een onafgemaakt idee is. {beschrijving} = begin van dat idee.
onafgemaakt:
  melding: "Je hebt nog een onafgemaakt idee: \"{beschrijving}\""
  knop: Verder met dat idee

# Knop en bevestiging om de wizard af te ronden als er niets meer te doen is.
afronden:
  knop: Afronden
  bevestiging: "Klaar. Je advies {referentie} is afgerond en staat hieronder. Hier volg je ook de status."

statussen:
  advies_gegeven: Advies gegeven
  account_aangevraagd: Account aangevraagd
  in_toetsing: In toetsing
  goedgekeurd: Goedgekeurd
  goedgekeurd_met_voorwaarden: Goedgekeurd met voorwaarden
  afgewezen: Afgewezen
  contact_volgt: Contact volgt

besluiten:
  goedgekeurd: Goedgekeurd
  goedgekeurd_met_voorwaarden: Goedgekeurd met voorwaarden
  afgewezen: Afgewezen

toetsing:
  titel: Toetsing
  intro: Aanvragen die bij jouw rol als toetser horen. Bekijk de antwoorden en leg je besluit vast. Je inzage wordt vastgelegd in de audit-log.
  toelichting_voorwaarden: Welke voorwaarden gelden?
  toelichting_afwijzing: Waarom wijs je de aanvraag af?
  ter_informatie: Ter informatie (Niet op deze manier)
  ter_informatie_uitleg: Bij deze uitkomst is er geen aanvraag en hoef je geen besluit te nemen. Je ziet hem zodat je weet wat er speelt.

beheer:
  titel: Beheer
  intro: Alle adviezen en de inhoud van de coach. De inhoud (tools, spelregels, beslisregels) wijzig je via Git in de map content/; elke wijziging krijgt een nieuw versienummer. Je inzage wordt vastgelegd in de audit-log.

# Signaal dat de compliance officer de toepassing moet classificeren volgens de AI Act.
ai_act:
  titel: AI Act-classificatie nodig
  uitleg: >-
    De AI Act is de Europese wet voor AI. Omdat de oplossing zelfstandig handelt of adviseert of beslist over
    mensen, bepaalt de AI governance & compliance officer in welke risicoklasse je toepassing valt.

# Bij check 6: lijst met wat je extra moet regelen per antwoord.
extra_regelen_titel: Wat moet je extra regelen?

# Rode uitkomst zonder alternatief: Team DO kon (nog) niet worden ingelicht.
contact_opnieuw:
  melding: Team Digitale Ontwikkeling is nog niet op de hoogte gebracht. Probeer het opnieuw.
  knop: Team Digitale Ontwikkeling informeren

dpia:
  titel: Mogelijk is een DPIA nodig
  uitleg: Een DPIA (gegevensbeschermingseffectbeoordeling) brengt de privacyrisico's van een toepassing in kaart. Bij jouw antwoorden is die mogelijk verplicht. De AI governance & compliance officer kijkt met je mee.

coach_niet_beschikbaar: De coach is nu niet beschikbaar. Je kunt gewoon verder door zelf te kiezen.

# Uitlegpagina "Hoe werkt de coach?" (/hoe-werkt-het) en korte verwijzingen ernaar.
hoe_werkt_het:
  titel: Hoe werkt de coach?
  link: Hoe werkt de coach?
  intro: >-
    De IJK Toolbox Coach gebruikt een AI agent om met je mee te denken. Maar de AI agent beslist niet
    of je idee goedgekeurd wordt. Dat bepalen de vaste spelregels van IJK en, als dat nodig is, de toetsers.
    Zo is elk advies uitlegbaar en krijgt iedereen met dezelfde antwoorden hetzelfde advies.
  wie_titel: Wie doet wat?
  rijen:
    - onderdeel: Je idee begrijpen
      wie: AI-coach
      hoe: De coach leest je beschrijving en stelt hooguit twee vragen als iets nog niet duidelijk is.
    - onderdeel: Welke tool past?
      wie: AI-coach
      hoe: De coach kiest een tool uit de IJK Toolbox en legt uit waarom. Je kunt het advies accepteren, om een andere tool vragen of zelf kiezen.
    - onderdeel: De zes checks
      wie: AI-coach stelt voor, jij bevestigt
      hoe: De coach vult de checks alvast in. Twijfelt hij, dan vraagt hij door in de chat. Jij ziet de voorstellen en past ze aan waar nodig.
    - onderdeel: Aanvullende vragen
      wie: Jij
      hoe: Deze vragen beantwoord je altijd zelf.
    - onderdeel: Het advies (de kleur)
      wie: Vaste spelregels
      hoe: De tool berekent de kleur, de toetsers en of een DPIA mogelijk nodig is. Dat gebeurt met de spelregels van IJK, niet door de AI agent.
    - onderdeel: Uitleg bij het advies
      wie: AI-coach
      hoe: De coach legt het berekende advies uit in gewone taal. Hij kan het advies niet veranderen.
    - onderdeel: Vragen tussendoor
      wie: AI-coach
      hoe: In de chat kun je op elk moment een vraag stellen over de tools en de spelregels.
    - onderdeel: Vervolgactie
      wie: Jij en de tool
      hoe: Pas als jij op de knop klikt, vraagt de tool een account aan of stuurt je aanvraag naar de toetsers. De AI agent kan dat niet zelf.
  waarom_titel: Waarom bepaalt de AI agent niet de kleur?
  waarom:
    - "Uitlegbaar: bij elk advies staat welke antwoorden de doorslag gaven en met welke versie van de spelregels het is berekend."
    - "Eerlijk: dezelfde antwoorden geven altijd hetzelfde advies. Een taalmodel kan op dezelfde vraag verschillende antwoorden geven."
    - "Controleerbaar: de spelregels worden beheerd door Team Digitale Ontwikkeling en de AI governance & compliance officer."
  privacy_titel: Wat gaat er naar de AI agent?
  privacy:
    - Alleen wat nodig is voor de vraag, zoals je beschrijving en je antwoorden.
    - Niet je naam of e-mailadres. De coach kent je alleen als een willekeurige code.
    - E-mailadressen, telefoonnummers en rekeningnummers in je tekst worden er eerst uitgehaald. Gebruik toch liever geen namen of andere persoonsgegevens.
    - Het gesprek wordt niet bewaard in het adviesregister. Na het afronden wordt het verwijderd.
  zonder_ai_titel: En als de AI agent niet werkt?
  zonder_ai: Dan vul je alles zelf in. Je krijgt hetzelfde advies, want dat wordt altijd met de vaste spelregels berekend.
  demo_melding: In deze demo is de coach een oefencoach zonder AI. Die geeft eenvoudige voorbeeldantwoorden.
  kleur_hint: Deze kleur is berekend met de vaste spelregels van IJK, niet door de AI agent.
