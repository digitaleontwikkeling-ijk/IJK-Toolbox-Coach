# Regelset van de IJK Toolbox Coach
#
# Bron: presentatie "Verantwoord innoveren en ontwikkelen met de IJK Toolbox coach" (nov. 2026).
# Beheer: Team Digitale Ontwikkeling + AI governance & compliance officer.
# Verhoog bij ELKE inhoudelijke wijziging het versienummer en noteer de wijziging
# in content/CHANGELOG.md. Het versienummer wordt bij elk advies opgeslagen.
#
# Nog NIET gevalideerd door beide toetsers.
# TODO: valideren door toetsers

versie: "0.9"
gevalideerd: false

# Uitkomstkleuren, van laag naar hoog. De volgorde bepaalt welke kleur "het hoogst" is.
# hex: kleur uit het IJK-huisstijlhandboek (08-2025) waar mogelijk:
#   groen = Blad, oranje = Zon, rood = Avondrood. Het handboek heeft geen geel;
#   daarvoor gebruiken we de kleur uit de opdracht.
# tekstkleur: kleur van tekst op dit vlak, gekozen voor voldoende contrast (WCAG AA).
# motivatie: tekst voor "Waarom deze kleur?"; zie onderaan dit bestand.
# toetsers: geen | per_check (de toetser van elke check met deze kleur) | alle (beide toetsers samen)
# contact_als_geen_alternatief: is er geen alternatief, dan neemt Team Digitale Ontwikkeling contact op.
kleuren:
  - id: groen
    uitkomst: Direct aan de slag
    hex: "#50A78A"
    tekstkleur: "#1E0E3B"
    vervolgactie: accountaanvraag
    toetsers: geen
    motivatie: Alle checks scoren groen.
  - id: geel
    uitkomst: Aan de slag met voorwaarden
    hex: "#EFBE2E"
    tekstkleur: "#1E0E3B"
    vervolgactie: accountaanvraag_met_voorwaarden
    toetsers: geen
    motivatie: "{redenen}."
  - id: oranje
    uitkomst: Eerst toetsen
    hex: "#F69B37"
    tekstkleur: "#1E0E3B"
    vervolgactie: toetsing
    toetsers: per_check
    motivatie: "{redenen}."
  - id: rood
    uitkomst: Niet op deze manier
    hex: "#D61539"
    tekstkleur: "#FFFFFF"
    vervolgactie: alleen_vastleggen
    toetsers: alle
    contact_als_geen_alternatief: true
    motivatie: "{redenen}."

# Toetsers.
toetsers:
  - id: toetser_compliance
    naam: AI governance & compliance officer
  - id: toetser_architect
    naam: architect Digitale Ontwikkeling

# De zes checks.
# toetser: wie toetst als deze check oranje scoort.
#   TODO: valideren door toetsers of oranje op Impact-Beschikbaarheid (continuïteit) ook naar de architect moet.
# hulp: hulpteksten bij de check (kop is optioneel).
# meerdere: true = de medewerker mag meerdere antwoorden kiezen; het antwoord met de hoogste kleur telt.
#   TODO: valideren door toetsers (welke checks meerdere antwoorden toestaan)
# Per antwoord:
#   uitleg: toelichting achter het "i"-knopje. TODO: valideren door toetsers (conceptteksten)
#   kort: korte naam voor "Waarom deze kleur?" (anders het label)
#   voorwaarde: alleen bij antwoorden die geel scoren; getoond als de uitkomst geel is.
#   alternatief: alleen bij antwoorden die rood scoren; getoond als de uitkomst rood is.
#   extra_regelen: wat je extra moet regelen bij dit antwoord (lijst "Wat moet je extra regelen?").
# deelvragen: de check bestaat uit deelvragen met dezelfde schaal; de hoogste kleur telt.
#   voorbeelden: per antwoord een voorbeeld. Alleen voor de coach (niet zichtbaar in de wizard: keuze IJK,
#   omdat voorbeelden vaak niet aansluiten op de use case van de medewerker).
checks:
  - id: data
    nummer: 1
    naam: Data
    vraag: Welke data gebruik je?
    toetser: toetser_compliance
    meerdere: true
    hulp:
      - kop: Persoonsgegevens
        tekst: Naam, e-mailadres, personeelsnummer, of alles wat je direct of indirect aan een persoon kunt koppelen.
      - kop: Testdata
        tekst: >-
          Gegevens die speciaal zijn gemaakt of geselecteerd om te testen, en die niet herleidbaar zijn tot echte
          personen, klanten of vertrouwelijke IJK-informatie. Een kopie van echte gegevens of een testomgeving met
          productiegegevens is géén testdata.
    antwoorden:
      - { id: openbaar, label: Openbaar, kleur: groen,
          uitleg: "Informatie die iedereen mag zien, zoals teksten op de website van IJK of openbare cijfers." }
      - { id: intern, label: Intern, kleur: groen,
          uitleg: "Informatie voor medewerkers van IJK, zoals werkinstructies of interne overzichten, zonder gegevens over personen." }
      - { id: persoonsgegevens, label: Persoonsgegevens, kleur: oranje,
          uitleg: "Naam, e-mailadres, personeelsnummer, of alles wat je direct of indirect aan een persoon kunt koppelen." }
      - { id: vertrouwelijk, label: Vertrouwelijk/gevoelig, kleur: oranje,
          uitleg: "Informatie die niet naar buiten mag of maar voor een kleine groep bedoeld is, zoals contracten, financiële gegevens of klantgegevens." }
      # Regelset 0.8 (B1): bij twijfel over persoonsgegevens net zo voorzichtig als bij persoonsgegevens.
      - { id: weet_niet, label: Weet ik niet zeker, kleur: oranje, kort: niet zeker of er persoonsgegevens in zitten,
          uitleg: "Je weet niet zeker of er gegevens in zitten die je aan een persoon kunt koppelen. Dan gaan we voor de zekerheid uit van wel." }

  - id: systemen
    nummer: 2
    naam: Systemen
    vraag: Welke systemen raak je?
    toetser: toetser_architect
    meerdere: true
    hulp:
      - kop: Voorwaarde bij Lezen
        tekst: Via een goedgekeurde koppeling en met IJK-credentials (alleen lezen).
    antwoorden:
      - { id: geen, label: Geen, kleur: groen,
          uitleg: "De oplossing werkt los van IJK-systemen, bijvoorbeeld met gegevens die je zelf invoert of met testdata." }
      - id: lezen
        uitleg: "De oplossing haalt gegevens op uit een IJK-systeem, maar wijzigt niets. Via een goedgekeurde koppeling en met IJK-credentials (alleen lezen)."
        label: Lezen (uit een goedgekeurde IJK-bron)
        kort: Lezen
        kleur: geel
        voorwaarde: Gebruik de goedgekeurde koppeling en IJK-credentials met alleen leesrechten.
      - { id: koppelen, label: Koppelen, kleur: oranje,
          uitleg: "De oplossing verbindt twee of meer systemen met elkaar, zodat er gegevens worden uitgewisseld." }
      - { id: schrijven, label: Schrijven in bedrijfssystemen, kleur: oranje,
          uitleg: "De oplossing maakt, wijzigt of verwijdert gegevens in een bedrijfssysteem, zoals AFAS." }

  - id: gebruikers
    nummer: 3
    naam: Gebruikers
    vraag: Wie gebruikt de oplossing?
    toetser: toetser_architect
    meerdere: true
    hulp:
      - kop: IJK-principe
        tekst: >-
          Hoe breder een oplossing wordt gebruikt, hoe minder het nog een persoonlijk experiment is en hoe meer eisen
          we stellen aan beheer, beveiliging en continuïteit.
    antwoorden:
      - { id: alleen_ik, label: Alleen ik, kleur: groen,
          uitleg: "Alleen jij gebruikt de oplossing, voor je eigen werk." }
      - id: collegas
        uitleg: "Een paar directe collega's gebruiken de oplossing ook."
        label: Collega's
        kleur: geel
        voorwaarde: Gaat je team erop vertrouwen? Wijs een eigenaar aan en documenteer.
      - { id: afdeling, label: Afdeling, kleur: oranje,
          uitleg: "Je hele afdeling gebruikt de oplossing." }
      - { id: organisatie, label: Organisatie, kleur: oranje,
          uitleg: "Medewerkers in heel IJK, of in meerdere afdelingen, gebruiken de oplossing." }
      - { id: extern, label: Extern/klanten, kleur: oranje,
          uitleg: "Klanten, klantmedewerkers of andere mensen buiten IJK gebruiken de oplossing of zien de uitkomst." }

  - id: autonomie
    nummer: 4
    naam: Autonomie
    vraag: Wat mag de oplossing doen?
    toetser: toetser_compliance
    meerdere: true
    hulp:
      - kop: Reflectievraag
        tekst: Beslist de tool, of beslis jij op basis van wat de tool aangeeft?
    antwoorden:
      - { id: assisteren, label: Assisteren, kleur: groen,
          uitleg: "De oplossing helpt je bij je werk, zoals een tekst opstellen of samenvatten. Jij doet de rest." }
      - { id: adviseren, label: Adviseren, kleur: groen,
          uitleg: "De oplossing doet een voorstel of geeft advies. Jij beslist wat je ermee doet." }
      - id: lezen
        uitleg: "De oplossing zoekt of haalt zelfstandig gegevens op, maar verandert niets."
        label: Lezen
        kleur: geel
        # TODO: valideren door toetsers (placeholder, tekst nog aan te leveren door IJK)
        voorwaarde: "[Placeholder] Voorwaarde bij Autonomie = Lezen wordt nog vastgesteld door de toetsers."
      - { id: schrijven, label: Schrijven, kleur: oranje,
          uitleg: "De oplossing maakt of wijzigt zelf gegevens of documenten." }
      - { id: handelen, label: Handelen, kleur: oranje,
          uitleg: "De oplossing voert zelfstandig acties uit, zoals een mail versturen, een betaling goedkeuren of een proces starten." }
      - id: beslissen
        uitleg: "De oplossing neemt zelf een besluit over mensen, bijvoorbeeld wie wordt uitgenodigd voor een sollicitatiegesprek."
        label: Beslissen (over mensen)
        kleur: rood
        # Alternatief uit testscenario 6 van de opdracht. TODO: valideren door toetsers
        alternatief: Laat AI samenvatten of adviseren, en laat een mens (bijvoorbeeld de recruiter) beslissen.

  - id: impact
    nummer: 5
    naam: Impact
    vraag: Wat is de impact als het misgaat?
    toetser: toetser_compliance
    hulp:
      - tekst: >-
          Kijk naar de gevolgen voor jezelf, collega's, klanten en IJK, op beschikbaarheid, integriteit en
          vertrouwelijkheid. De hoogste score telt.
    antwoorden:
      - { id: nauwelijks, label: Nauwelijks, kleur: groen }
      - id: beperkt
        label: Beperkt
        kleur: geel
        # TODO: valideren door toetsers (placeholder, tekst nog aan te leveren door IJK)
        voorwaarde: "[Placeholder] Voorwaarde bij Impact = Beperkt wordt nog vastgesteld door de toetsers."
      - { id: serieus, label: Serieus, kleur: oranje }
      # Geen alternatief: bij rood zonder alternatief neemt Team Digitale Ontwikkeling contact op.
      - { id: groot, label: Groot, kleur: rood }
    # TODO: afstemmen op de BIV-definities uit het IJK-risicomanagementproces
    deelvragen:
      - id: beschikbaarheid
        naam: Beschikbaarheid
        vraag: Wat als het niet werkt?
        voorbeelden:
          nauwelijks: Ik doe het zelf even opnieuw.
          beperkt: Een paar collega's kunnen tijdelijk niet verder.
          serieus: Een afdeling of klantproces ligt stil.
          groot: Een kritisch IJK-proces of de dienstverlening aan klanten valt langdurig uit.
      - id: integriteit
        naam: Integriteit
        vraag: Wat als de uitkomst fout is?
        voorbeelden:
          nauwelijks: Een fout in mijn eigen concept, die ik zelf zie.
          beperkt: Een fout in een intern overzicht, snel te herstellen.
          serieus: Verkeerde gegevens in AFAS of verkeerde informatie naar klanten.
          groot: Een automatisch besluit met grote gevolgen voor mensen.
      - id: vertrouwelijkheid
        naam: Vertrouwelijkheid
        vraag: Wat als informatie bij de verkeerde komt?
        voorbeelden:
          nauwelijks: Alleen openbare informatie.
          beperkt: Interne informatie bij de verkeerde collega.
          serieus: Persoons- of klantgegevens buiten de bedoelde groep.
          groot: Bijzondere persoonsgegevens of veel klantgegevens op straat (datalek).

  - id: afhankelijkheid
    nummer: 6
    naam: Afhankelijkheid
    vraag: Hoe ga je de oplossing gebruiken?
    toetser: toetser_architect
    antwoorden:
      - id: experiment
        uitleg: "Je probeert iets uit, eenmalig of voor korte tijd. Als het stopt, heeft niemand er last van."
        label: Eenmalig of om uit te proberen (experiment)
        kort: Experiment
        kleur: groen
        extra_regelen: Niets extra's.
      - id: persoonlijk
        uitleg: "Je gebruikt de oplossing regelmatig voor je eigen werk. Als hij stopt, heb jij er last van."
        label: Regelmatig, voor mijn eigen werk (persoonlijke oplossing)
        kort: Persoonlijke oplossing
        kleur: groen
        extra_regelen: "+ documentatie, security"
      - id: team
        uitleg: "Je team rekent op de oplossing in het dagelijkse werk. Als hij stopt, heeft je team er last van."
        label: Vast onderdeel van het werk van mijn team (teamoplossing)
        kort: Teamoplossing
        kleur: oranje
        extra_regelen: "+ eigenaarschap, beheer, logging"
      - id: bedrijf
        uitleg: "Een IJK-proces of de dienstverlening aan klanten hangt van de oplossing af."
        label: Vast onderdeel van een IJK-proces (bedrijfsoplossing)
        kort: Bedrijfsoplossing
        kleur: oranje
        extra_regelen: "+ monitoring, architectuur, continuïteit, lifecycle management"

# Extra vragen die alleen bij een bepaald antwoord worden gesteld.
# (De vraag "Gaat het advies over mensen?" is in regelset 0.8 opgegaan in de AI-vraag over invloed op mensen.)
extra_vragen:
  - id: bijzondere_persoonsgegevens
    check: data
    toon_bij: [persoonsgegevens, weet_niet]
    vraag: Gaat het om bijzondere persoonsgegevens, zoals gezondheid?
    uitleg: Bijzondere persoonsgegevens zijn extra gevoelig, zoals gegevens over gezondheid, religie of afkomst.
    # "Weet ik niet zeker" telt bij de privacy-telling als indicator (net als bij de andere privacyvragen).
    onzeker_mogelijk: true

# Rode vlaggen: ja = altijd deze kleur. In de interface heten ze "Aanvullende vragen".
rode_vlag_kleur: rood
rode_vlaggen:
  # Vraag "Gebruik je een tool die IJK niet heeft goedgekeurd?" is vervallen (regelset 0.7):
  # een tool buiten de IJK Toolbox kies je nu in stap 2 en gaat altijd ter toetsing (zie tool_buiten_toolbox).
  - id: persoonlijke_inlog_of_secrets
    nummer: 1
    vraag: Log je met je eigen account in op een systeem buiten Microsoft 365 (bijvoorbeeld een HubBI-flow met jouw AFAS-inlog), of zet je wachtwoorden of API-keys in de code?
    # TODO: valideren door toetsers
    uitleg: Copilot workflows draaien standaard op je eigen account binnen Microsoft 365. Dat telt hier niet mee.
    kort: een persoonlijke inlog of wachtwoorden/API-keys in de code
    alternatief: Gebruik IJK-credentials.
  - id: ai_beslist_over_mensen
    nummer: 2
    # Alleen gesteld als bij Autonomie "Beslissen" is gekozen; anders is het antwoord "nee" (regelset 0.8, B7).
    toon_bij: { check: autonomie, antwoorden: [beslissen] }
    vraag: Beslist AI zelfstandig over mensen, met grote gevolgen?
    kort: AI die zelfstandig over mensen beslist
    # Geen alternatief in de presentatie: dan neemt Team Digitale Ontwikkeling contact op.
  - id: open_zonder_toetsing
    nummer: 3
    vraag: Zet je een oplossing met echte gegevens zonder toetsing open voor klanten of op internet?
    kort: een oplossing met echte gegevens die zonder toetsing openstaat
    alternatief: Eerst toetsen, dan pas delen.
  - id: proces_zonder_eigenaar
    nummer: 4
    vraag: Gaat een proces binnen IJK draaien op een persoonlijke oplossing zonder eigenaar of beheer?
    kort: een IJK-proces op een persoonlijke oplossing zonder eigenaar of beheer
    alternatief: Wijs een eigenaar aan en regel het beheer.

# "Weet ik niet zeker" bij een aanvullende vraag: de uitkomst is minstens deze kleur en beide toetsers
# kijken mee, zodat er altijd iemand naar de twijfel kijkt (keuze IJK, regelset 0.9).
# {kort} = de korte omschrijving van de vraag(en). TODO: valideren door toetsers
rode_vlag_onzeker:
  minimale_uitkomst: oranje
  toetsers: [toetser_compliance, toetser_architect]
  motivatie: "niet zeker bij: {kort}"

# Tool buiten de IJK Toolbox: de medewerker kiest in stap 2 een tool die (nog) niet in de toolbox zit.
# De zes checks en de aanvullende vragen gelden gewoon (de uitkomst kan dus ook rood worden),
# maar de uitkomst is minstens deze kleur en de aanvraag gaat altijd naar deze toetsers (keuze IJK).
# TODO: valideren door toetsers
tool_buiten_toolbox:
  minimale_uitkomst: oranje
  toetsers: [toetser_compliance, toetser_architect]
  # Tekst in "Waarom deze kleur?" als de tool de kleur verhoogde.
  motivatie: de tool zit nog niet in de IJK Toolbox

# "Waarom deze kleur?": per kleur staat de tekst bij de kleur (veld motivatie).
# {redenen} wordt vervangen door de doorslaggevende checks en rode vlaggen,
# bijvoorbeeld "Persoonsgegevens (Data) en Koppelen (Systemen)".
# Zo wordt een rode vlag in die opsomming beschreven ({kort} = korte omschrijving van de vlag):
motivatie_rode_vlag: "{kort}"

# =====================================================================================================
# Verdieping: privacy (pre-DPIA) en AI-risico, geïntegreerd in de checks (regelset 0.8).
# Bron: opdracht "Privacy/DPIA- en AI-risicoclassificatie integreren" (nov. 2026), keuzes B1–B8 in
# docs/analyse-privacy-ai.md. TODO: valideren door de AI governance & compliance officer.
#
# Principe: vraag informatie maar één keer uit (REUSE → REFINE → ASK).
# - Welke gegevens uit de checks kunnen worden afgeleid, staat in src/domain/verdieping.ts (één plek,
#   met per afleiding de categorie: deterministisch = niet vragen, signaal = gerichte vraag met inleiding).
# - Hier staan de vragen, antwoorden en teksten, en de regels voor de DPIA-telling en het AI-risico.
#
# Per gegeven:
#   spoor:   basis (altijd) | dpia (bij persoonsgegevens of twijfel) | ai (als de oplossing AI gebruikt)
#   plek:    onder welke check de vraag verschijnt
#   vraag, uitleg ("waarom vragen we dit?"), antwoorden
#   signaal: inleiding als er al gedeeltelijke informatie is (de vraag wordt dan een verduidelijking)
#   naam:    korte naam in het resultaat
# =====================================================================================================
gegevens:
  # ---- Basis: gebruikt de oplossing AI? (één antwoord voor DPIA-indicator 7 én het AI-spoor) ----
  - id: ai_gebruik
    spoor: basis
    plek: autonomie
    naam: AI
    vraag: Gebruikt je oplossing AI, bijvoorbeeld om tekst te maken, iets te beoordelen of te voorspellen?
    uitleg: Dan stel ik nog een paar vragen over wat de AI doet. Zonder AI slaan we die over.
    antwoorden:
      - { id: ja, label: "Ja" }
      - { id: nee, label: "Nee" }
      - { id: weet_niet, label: Weet ik niet zeker }

  # ---- Privacy (pre-DPIA): de acht indicatoren, voor zover niet al bekend uit de checks ----
  - id: kwetsbare_groepen
    spoor: dpia
    plek: data
    naam: Kwetsbare groepen
    vraag: Gaat het om gegevens van mensen in een kwetsbare positie, zoals kinderen, zieke of re-integrerende medewerkers, of sollicitanten?
    uitleg: Je gaf aan dat je persoonsgegevens gebruikt. Daarom wil ik iets beter begrijpen om wie het gaat.
    antwoorden: &jnw
      - { id: ja, label: "Ja" }
      - { id: nee, label: "Nee" }
      - { id: weet_niet, label: Weet ik niet zeker }
  - id: koppeling_datasets
    spoor: dpia
    plek: systemen
    naam: Gegevens uit verschillende bronnen gecombineerd
    vraag: Combineer je persoonsgegevens uit verschillende bronnen, bijvoorbeeld uit AFAS en een Excel-bestand?
    uitleg: Gegevens combineren kan nieuwe informatie over mensen opleveren.
    signaal: Je koppelt systemen of schrijft in een bedrijfssysteem. Dat betekent niet altijd dat je gegevens over mensen combineert.
    antwoorden: *jnw
  - id: grote_schaal
    spoor: dpia
    plek: gebruikers
    naam: Grote schaal of structureel volgen
    vraag: Verwerk je gegevens van veel mensen (bijvoorbeeld alle medewerkers of klanten), of volg je mensen structureel?
    uitleg: Hoe meer mensen het raakt, hoe zorgvuldiger het moet.
    signaal: Je oplossing wordt breed of structureel gebruikt. Dat zegt nog niet hoeveel mensen er in de gegevens staan.
    antwoorden: *jnw
  - id: profilering
    spoor: dpia
    plek: autonomie
    naam: Beoordelen of rangschikken van mensen
    vraag: Beoordeelt of rangschikt de oplossing mensen, bijvoorbeeld op prestaties, gedrag of geschiktheid?
    uitleg: Je gebruikt persoonsgegevens. Daarom wil ik weten wat de oplossing met die gegevens doet.
    antwoorden: *jnw
  - id: geautomatiseerd_besluit
    spoor: dpia
    plek: autonomie
    naam: Besluiten over mensen zonder menselijke controle
    vraag: Neemt de oplossing zelf besluiten over mensen, zonder dat een mens die eerst controleert?
    uitleg: Je gebruikt persoonsgegevens. Daarom wil ik weten wie er beslist.
    signaal: Je gaf aan dat de oplossing zelf schrijft of handelt. Dat is niet altijd een besluit over mensen.
    antwoorden: *jnw
  - id: significante_gevolgen
    spoor: dpia
    plek: impact
    naam: Grote gevolgen voor mensen
    vraag: Kan het gevolgen hebben voor de mensen van wie de gegevens zijn, zoals voor hun baan, inkomen of gezondheid?
    uitleg: Je gebruikt persoonsgegevens. Daarom wil ik weten wat het voor die mensen kan betekenen.
    signaal: Je gaf aan dat de impact serieus of groot kan zijn. Ik wil weten of dat ook de mensen in de gegevens raakt.
    antwoorden: *jnw

  # ---- AI-spoor: alleen als de oplossing AI gebruikt (of als je het niet zeker weet) ----
  - id: ai_invloed
    spoor: ai
    plek: autonomie
    naam: Invloed op mensen
    vraag: Raakt wat de AI doet de rechten, plichten of kansen van mensen?
    uitleg: Bijvoorbeeld wie wordt uitgenodigd, wie extra begeleiding krijgt of welke klant een aanbod krijgt.
    signaal: Je gaf aan dat de oplossing adviseert. Ik wil weten of dat advies over mensen gaat.
    antwoorden:
      - { id: nee, label: "Nee" }
      - { id: indirect, label: "Ja, indirect (bijvoorbeeld als advies of signalering)" }
      - { id: direct, label: "Ja, direct (de uitkomst beslist of weegt zwaar mee)" }
  - id: ai_doorslaggevend
    spoor: ai
    plek: autonomie
    naam: Gewicht van de AI-uitkomst
    vraag: Hoe zwaar weegt de uitkomst van de AI in het besluit?
    uitleg: Beslist de AI, of beslis jij op basis van wat de AI aangeeft?
    signaal: Je gaf aan dat de oplossing adviseert. Ik wil weten hoe zwaar dat advies weegt.
    antwoorden:
      - { id: nee, label: "Niet doorslaggevend: een mens beslist" }
      - { id: mede, label: "Mede bepalend" }
      - { id: doorslaggevend, label: "Doorslaggevend" }
  - id: ai_domein
    spoor: ai
    plek: autonomie
    naam: Toepassingsgebied
    vraag: Op welk gebied wordt de AI toegepast?
    uitleg: Dit leggen we vast voor de toetsing. Het verandert de uitkomst niet.
    antwoorden:
      - { id: werk_hr, label: "Werk en HR, zoals werving, beoordeling of inzetbaarheid" }
      - { id: onderwijs, label: Onderwijs of training }
      - { id: diensten, label: "Toegang tot diensten, voorzieningen of subsidies" }
      - { id: financieel, label: "Financiële of economische beoordeling, zoals krediet, risico of fraude" }
      - { id: gezondheid, label: Gezondheid of welzijn }
      - { id: veiligheid, label: "Veiligheid, toezicht of handhaving" }
      - { id: anders, label: Iets anders }
  - id: ai_discriminatie
    spoor: ai
    plek: autonomie
    naam: Risico op ongelijke behandeling
    vraag: Kan de AI leiden tot ongelijke behandeling, discriminatie of uitsluiting van mensen?
    uitleg: AI kan onbedoeld groepen benadelen, bijvoorbeeld door scheve voorbeelddata.
    antwoorden:
      - { id: nee, label: "Nee" }
      - { id: mogelijk, label: Mogelijk }
      - { id: ja, label: "Ja" }
  - id: ai_herziening
    spoor: ai
    plek: autonomie
    naam: Herziening door een mens
    vraag: Kunnen de mensen om wie het gaat een uitkomst van de AI laten herzien door een mens?
    uitleg: Iemand moet bezwaar kunnen maken tegen een uitkomst die hem raakt.
    antwoorden:
      - { id: altijd, label: "Ja, altijd" }
      - { id: beperkt, label: "Ja, maar beperkt" }
      - { id: nee, label: "Nee" }
      - { id: onzeker, label: Weet ik niet zeker }
  - id: ai_transparantie
    spoor: ai
    plek: autonomie
    naam: Informeren over AI
    vraag: Worden de mensen om wie het gaat (of de gebruikers) geïnformeerd dat er AI wordt gebruikt?
    uitleg: Mensen hebben het recht om te weten dat ze met AI te maken hebben.
    antwoorden:
      - { id: ja, label: "Ja" }
      - { id: gedeeltelijk, label: Gedeeltelijk }
      - { id: nee, label: "Nee" }
      - { id: onzeker, label: Weet ik niet zeker }
  - id: ai_toezicht
    spoor: ai
    plek: autonomie
    naam: Menselijk toezicht
    vraag: Kijkt er structureel een mens mee naar de uitkomsten van de AI?
    uitleg: Bijvoorbeeld een vaste controle van een steekproef, of iemand die elke uitkomst bekijkt.
    antwoorden:
      - { id: structureel, label: "Ja, structureel" }
      - { id: incidenteel, label: "Ja, af en toe" }
      - { id: nee, label: "Nee" }
      - { id: onzeker, label: Weet ik niet zeker }
  - id: ai_uitlegbaarheid
    spoor: ai
    plek: autonomie
    naam: Uitlegbaarheid
    vraag: Kun je uitleggen hoe de AI tot een uitkomst komt, aan gebruikers of aan een toezichthouder?
    uitleg: Bij generatieve AI, zoals Copilot, is dat vaak maar beperkt.
    antwoorden:
      - { id: goed, label: Goed uitlegbaar }
      - { id: beperkt, label: Beperkt uitlegbaar }
      - { id: niet, label: Niet uitlegbaar }
      - { id: onbekend, label: Weet ik niet }

# Privacy (pre-DPIA): telling van de acht indicatoren. "Ja" en "weet ik niet zeker" tellen allebei mee.
# Alleen als er persoonsgegevens zijn, of als de medewerker dat niet zeker weet (Data).
# Bron per indicator: een gegeven hierboven, of bijzondere_persoonsgegevens (extra vraag bij Data).
dpia:
  toetser: toetser_compliance
  indicatoren:
    - { id: profilering, naam: Mensen worden beoordeeld of gerangschikt }
    - { id: geautomatiseerd_besluit, naam: Besluiten over mensen zonder menselijke controle }
    - { id: significante_gevolgen, naam: Mogelijk grote gevolgen voor de mensen in de gegevens }
    - { id: bijzondere_persoonsgegevens, naam: Bijzondere persoonsgegevens }
    - { id: grote_schaal, naam: Gegevens van veel mensen of structureel volgen }
    - { id: kwetsbare_groepen, naam: Mensen in een kwetsbare positie }
    - { id: ai_gebruik, naam: Nieuwe technologie (AI) }
    - { id: koppeling_datasets, naam: Gegevens uit verschillende bronnen gecombineerd }
  # Klasse = de hoogste klasse waarvan "vanaf" ≤ het aantal indicatoren.
  # minimale_uitkomst: de Toolbox-uitkomst is minstens deze kleur (B4).
  klassen:
    - { id: geen, naam: Geen volledige DPIA nodig, vanaf: 0 }
    - { id: waarschijnlijk, naam: Waarschijnlijk volledige DPIA nodig, vanaf: 2, minimale_uitkomst: oranje }
    - { id: verplicht, naam: Volledige DPIA verplicht, vanaf: 3, minimale_uitkomst: oranje }
  # Tekst in "Waarom deze kleur?" als de DPIA-klasse de kleur verhoogde.
  motivatie: "{klasse} ({aantal} privacy-indicatoren)"

# AI-risico: Hoog > Beperkt > Geen/laag. De klasse kan alleen omhoog (hoogste over alle regels).
# regels: per gegeven en antwoord de klasse (antwoorden die niet genoemd zijn: "ga verder", geen verhoging),
#   met een voorwaarde voor bij "Aan de slag met voorwaarden" (Beperkt).
ai_risico:
  toetser: toetser_compliance
  klassen:
    - { id: laag, naam: Geen of laag risico }
    - { id: beperkt, naam: Beperkt risico, minimale_uitkomst: geel }
    - { id: hoog, naam: Hoog risico, minimale_uitkomst: oranje }
  regels:
    - { gegeven: ai_invloed, antwoord: direct, klasse: hoog }
    - { gegeven: ai_discriminatie, antwoord: ja, klasse: hoog }
    - { gegeven: ai_herziening, antwoord: nee, klasse: hoog }
    - { gegeven: ai_doorslaggevend, antwoord: doorslaggevend, klasse: hoog }
    - { gegeven: ai_transparantie, antwoord: nee, klasse: hoog }
    - { gegeven: ai_transparantie, antwoord: gedeeltelijk, klasse: beperkt,
        voorwaarde: Vertel de mensen om wie het gaat (of de gebruikers) duidelijk dat er AI wordt gebruikt. }
    - { gegeven: ai_toezicht, antwoord: nee, klasse: hoog }
    - { gegeven: ai_toezicht, antwoord: incidenteel, klasse: beperkt,
        voorwaarde: Regel dat er structureel een mens meekijkt naar de uitkomsten van de AI. }
    - { gegeven: ai_uitlegbaarheid, antwoord: niet, klasse: hoog }
    - { gegeven: ai_uitlegbaarheid, antwoord: beperkt, klasse: beperkt,
        voorwaarde: Controleer de uitkomsten van de AI zelf, want de AI kan niet goed uitleggen hoe hij tot een uitkomst komt. }
    - { gegeven: ai_uitlegbaarheid, antwoord: onbekend, klasse: beperkt,
        voorwaarde: Zoek uit hoe de AI tot een uitkomst komt en controleer de uitkomsten zelf. }
  # Tekst in "Waarom deze kleur?" als het AI-risico de kleur verhoogde.
  motivatie: "{klasse} bij het gebruik van AI"
